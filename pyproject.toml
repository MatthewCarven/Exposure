[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure"
version = "0.1.0"
description = "Attach to a running Python 3.14+ process and inspect (later, control) it live."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exposure = "exposure.cli:main"

[tool.setuptools]
packages = ["exposure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
