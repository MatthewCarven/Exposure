# Exposure policy for PySynthRack. Pass it with --policy, or copy it next to
# the program as exposure.toml (Exposure looks next to the main script and in
# the working directory).
#
#   exposure ls PID self.patch.modules --policy examples/pysynthrack.toml
#   exposure do PID param 1 '"amp"' 0.1
#   exposure do PID audio

[agent]
entry = "pysynthrack.ui.app:App.run"   # App is created inline; its run() frame holds self
scope = "both"                         # browse everything, change only what's below
pressure = "<entry>:self.backend._xruns"   # back off if the audio starts dropping out

[expose]
"<entry>:self.patch" = { read = true }
"<entry>:self.backend" = { read = true }
# _mirror_param writes the model, tells the backend and moves the widget.
"<entry>:self._mirror_param" = { call = true }
"<entry>:self._on_toggle_audio" = { call = true }

[actions]
param = "self._mirror_param"     # param MODULE_ID "NAME" VALUE
audio = "self._on_toggle_audio"  # start / stop audio

# exposure preset PID levels: a live panel of the audio engine. Change params
# with `do param` (it goes through _mirror_param: model, backend and widget);
# a tweak of params[...] directly would skip the backend notice and the widget,
# and isn't allowlisted here anyway.
[presets.levels]
watch = ["self.backend._xruns", "self.backend._dsp_load", "self.backend._dsp_load_peak",
         "self.backend._audio_levels", "len(self.patch.modules)", "self._buffer_size"]
rate = 10

# exposure panel PID --policy examples/pysynthrack.toml --preset panel
# A browser panel: engine readouts with graphs, and sliders that move the
# oscillator's amp and the output gain through _mirror_param (model, backend
# and widget together). Module ids are hello_sine's: 1 = Osc 1, 2 = Output.
[presets.panel]
watch = ["self.backend._xruns", "self.backend._dsp_load", "self.backend._dsp_load_peak",
         "self.backend._running", "self._buffer_size", "len(self.patch.modules)"]
rate = 10

[[presets.panel.sliders]]
label = "Osc 1 amp"
read = "self.patch.modules[1].params['amp']"
action = "param"
args = [1, "amp"]
range = [0, 1]
step = 0.01

[[presets.panel.sliders]]
label = "Output gain"
read = "self.patch.modules[2].params['gain']"
action = "param"
args = [2, "gain"]
range = [0, 1]
step = 0.01
