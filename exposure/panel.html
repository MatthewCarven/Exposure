<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Exposure panel</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1d2330; --muted: #6a7385; --line: #dde1e8;
    --accent: #2f6fde; --accent-ink: #ffffff; --warn: #c2410c; --good: #15803d;
    --spark: #2f6fde; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --card: #1a1f28; --ink: #e6e9ef; --muted: #8b94a7; --line: #2a3140;
      --accent: #5b8ff0; --accent-ink: #0b1020; --warn: #fb923c; --good: #4ade80;
      --spark: #7aa5f5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 16px; margin: 0; }
  .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
           background: var(--line); color: var(--ink); }
  .badge.paused { background: var(--warn); color: #fff; }
  .badge.live { background: var(--good); color: #fff; }
  main { display: grid; gap: 12px; padding: 12px 16px;
         grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px; min-width: 0; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
               color: var(--muted); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto 120px; gap: 8px;
         align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .path { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; }
  .val { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap;
         max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .val.changed { color: var(--accent); }
  .err { color: var(--warn); }
  canvas { width: 120px; height: 24px; display: block; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card);
           color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=number] { font: 12px var(--mono); padding: 6px 8px; min-width: 0;
         border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  input[type=range] { width: 100%; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .slider { padding: 6px 0; border-top: 1px solid var(--line); }
  .slider:first-of-type { border-top: 0; }
  .slider .top { display: flex; justify-content: space-between; gap: 8px; }
  .slider .bottom { display: grid; grid-template-columns: 1fr 90px; gap: 8px; align-items: center; }
  .action { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 4px 0; }
  #log { font: 12px/1.4 var(--mono); height: 220px; overflow: auto; white-space: pre-wrap;
         background: var(--bg); border-radius: 8px; padding: 8px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 480px) { .row { grid-template-columns: minmax(0, 1fr) auto; }
                              .row canvas { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Exposure</h1>
  <span class="meta" id="who">connecting…</span>
  <span class="badge" id="state">…</span>
  <span class="meta" id="fps"></span>
  <span id="status"></span>
</header>
<main>
  <section>
    <h2>Main loop</h2>
    <div class="controls">
      <button id="pause">Pause</button>
      <button id="step">Step</button>
      <button id="resume" class="primary">Resume</button>
    </div>
    <div class="controls" style="margin-top:10px">
      <input type="text" id="when" placeholder="break when… e.g. player.hp < 10" style="flex:1">
      <button id="arm">Arm</button>
      <button id="disarm">Clear</button>
    </div>
  </section>
  <section>
    <h2>Values</h2>
    <div id="values"><p class="empty">No watch list. Start the panel with --preset NAME, or
      add a [presets.NAME] watch = [...] to exposure.toml.</p></div>
  </section>
  <section>
    <h2>Controls</h2>
    <div id="sliders"><p class="empty">No sliders in this preset.</p></div>
  </section>
  <section>
    <h2>Actions</h2>
    <div id="actions"><p class="empty">No [actions] in the policy.</p></div>
  </section>
  <section style="grid-column: 1 / -1">
    <h2>Log (logpoints, traces, breakpoints)</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const $ = (id) => document.getElementById(id);
const hist = {};            // path -> recent numbers
const HISTORY = 60;
let config = null, since = 0, lastValues = {};

async function api(path, body) {
  const opts = { headers: { "X-Exposure-Token": TOKEN }, cache: "no-store" };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function status(msg, bad) {
  const el = $("status");
  el.textContent = msg || "";
  el.className = bad ? "err" : "";
}

function num(preview) {
  if (preview === "True" || preview === "False" || preview === undefined) return null;
  const n = Number(preview);
  return Number.isFinite(n) ? n : null;
}

function drawSpark(canvas, values) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (values.length < 2) return;
  const lo = Math.min(...values), hi = Math.max(...values), span = hi - lo || 1;
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--spark");
  g.lineWidth = 1.5;
  g.beginPath();
  values.forEach((v, i) => {
    const x = (i / (HISTORY - 1)) * w;
    const y = h - 2 - ((v - lo) / span) * (h - 4);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

function buildValues() {
  const box = $("values");
  if (!config.watch.length) return;
  box.innerHTML = "";
  for (const path of config.watch) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="path"></span><span class="val">…</span><canvas></canvas>';
    row.querySelector(".path").textContent = path;
    row.querySelector(".path").title = path;
    row.dataset.path = path;
    box.appendChild(row);
  }
}

let slideTimers = {};
function sendSlider(i, value) {
  clearTimeout(slideTimers[i]);
  slideTimers[i] = setTimeout(async () => {
    try { await api("/api/slider", { index: i, value: String(value) }); status(""); }
    catch (e) { status(e.message, true); }
  }, 80);                                            // at most ~12 changes a second
}

function buildSliders() {
  const box = $("sliders");
  if (!config.sliders.length) return;
  box.innerHTML = "";
  config.sliders.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "slider";
    const [lo, hi] = s.range || [0, 1];
    const step = s.step || (hi - lo) / 100;
    el.innerHTML = `<div class="top"><span class="path"></span><span class="val">…</span></div>
      <div class="bottom"><input type="range"><input type="number"></div>`;
    el.querySelector(".path").textContent = s.label || s.read;
    el.dataset.read = s.read;
    const range = el.querySelector("input[type=range]");
    const box2 = el.querySelector("input[type=number]");
    for (const inp of [range, box2]) { inp.min = lo; inp.max = hi; inp.step = step; }
    if (!s.range) range.disabled = true;
    range.addEventListener("input", () => { box2.value = range.value; sendSlider(i, range.value); });
    box2.addEventListener("change", () => { range.value = box2.value; sendSlider(i, box2.value); });
    el._inputs = [range, box2];
    box.appendChild(el);
  });
}

function buildActions() {
  const box = $("actions");
  if (!config.actions.length) return;
  box.innerHTML = "";
  for (const name of config.actions) {
    const el = document.createElement("div");
    el.className = "action";
    el.innerHTML = '<button></button><input type="text" placeholder="arguments, e.g. 1, \'amp\', 0.2">';
    const btn = el.querySelector("button"), args = el.querySelector("input");
    btn.textContent = name;
    btn.addEventListener("click", async () => {
      const values = args.value.trim() ? args.value.split(",").map((x) => x.trim()) : [];
      try {
        const r = await api("/api/do", { action: name, values });
        status(r.state === "error" ? `${name}: ${r.error}` : `${name}: done`, r.state === "error");
      } catch (e) { status(e.message, true); }
    });
    box.appendChild(el);
  }
}

async function refresh() {
  try {
    const s = await api("/api/state");
    const st = $("state");
    st.textContent = s.paused ? "PAUSED" : "running";
    st.className = "badge " + (s.paused ? "paused" : "live");
    $("fps").textContent = s.fps ? `${s.fps} fps` : "";
    for (const v of s.values) {
      const text = v.error ? v.error : v.preview;
      const n = num(v.preview);
      if (n !== null) { (hist[v.path] ||= []).push(n); if (hist[v.path].length > HISTORY) hist[v.path].shift(); }
      for (const row of document.querySelectorAll(`#values .row`)) {
        if (row.dataset.path !== v.path) continue;
        const val = row.querySelector(".val");
        val.textContent = text;
        val.title = text;
        val.className = "val" + (v.error ? " err" : lastValues[v.path] !== undefined && lastValues[v.path] !== text ? " changed" : "");
        drawSpark(row.querySelector("canvas"), hist[v.path] || []);
      }
      for (const el of document.querySelectorAll("#sliders .slider")) {
        if (el.dataset.read !== v.path) continue;
        el.querySelector(".val").textContent = text;
        if (n !== null && document.activeElement !== el._inputs[0] && document.activeElement !== el._inputs[1]) {
          el._inputs[0].value = n; el._inputs[1].value = n;
        }
      }
      lastValues[v.path] = text;
    }
  } catch (e) { status(e.message, true); }
}

async function pollLog() {
  try {
    const r = await api(`/api/events?since=${since}`);
    const log = $("log");
    for (const ev of r.events) {
      const t = new Date(ev.t * 1000).toLocaleTimeString();
      log.textContent += `${t} ${ev.probe ? "#" + ev.probe : "  "} [${ev.thread}] ${ev.text}\n`;
    }
    if (r.events.length) log.scrollTop = log.scrollHeight;
    since = r.next;
  } catch (e) { /* the state poll reports errors */ }
}

function wire() {
  const post = (p, b) => api(p, b || {}).then(() => status("")).catch((e) => status(e.message, true));
  $("pause").onclick = () => post("/api/pause");
  $("resume").onclick = () => post("/api/resume");
  $("step").onclick = () => post("/api/step", { n: 1 });
  $("arm").onclick = () => $("when").value.trim() && post("/api/break", { when: $("when").value.trim() });
  $("disarm").onclick = () => post("/api/unbreak");
}

(async function main() {
  if (!TOKEN) { status("missing token in the URL", true); return; }
  try { config = await api("/api/config"); }
  catch (e) { status(e.message, true); return; }
  $("who").textContent = `pid ${config.pid}` + (config.preset ? ` · preset ${config.preset}` : "") +
    ` · scope ${config.scope}` + (config.read_only ? " · read-only" : "");
  buildValues(); buildSliders(); buildActions(); wire();
  const period = 1000 / Math.min(10, Math.max(1, config.rate || 10));
  const tick = async () => { await refresh(); setTimeout(tick, period); };
  tick();
  setInterval(pollLog, 500);
})();
</script>
</body>
</html>
